# Evita que Supabase (plan gratuito) pause el proyecto por inactividad:
# hace una consulta mínima cada 3 días. Es el mismo pedido público que hace el sitio.
name: Mantener activo Supabase

on:
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta mínima a la base
        run: |
          CODIGO=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://smheqlbhwiybhjdsjxzw.supabase.co/rest/v1/trayectos?select=id&limit=1" \
            -H "apikey: sb_publishable_t6lkq5lvgb1KK9crS-d1-A_RnsCLNSQ")
          echo "Respuesta: $CODIGO"
          test "$CODIGO" = "200"
