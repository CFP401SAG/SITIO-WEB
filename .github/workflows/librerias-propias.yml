# Baja las librerías externas (Supabase, SweetAlert2, ExcelJS, etc.) a js/vendor/ y hace que la plataforma
# use esas copias en vez de un CDN. Se ejecuta a mano: Actions → «Librerías propias» → Run workflow.
# Ver tools/vendorizar-librerias.js. Es repetible: sirve también para actualizar versiones.
name: Librerías propias

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  vendorizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bajar librerías y cambiar los <script>
        run: node tools/vendorizar-librerias.js
      - name: Guardar los cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/vendor index.html preinscripcion.html
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Librerías propias: copias en js/vendor (sin CDN)"
          git push
